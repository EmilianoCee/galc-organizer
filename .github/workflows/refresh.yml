name: Refresh collection snapshot

on:
  schedule:
    # Once a day, ~06:20 UTC. The GALC API publishes no rate limit, so we poll
    # politely rather than often; availability here is a snapshot by design.
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      refresh_aspects:
        description: 'Re-measure every image (slow; only after a bulk image change)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-collection
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify the dimension parser still holds
        run: npm test

      - name: Pull from the GALC API
        run: |
          if [ "${{ inputs.refresh_aspects }}" = "true" ]; then
            node scripts/fetch-data.mjs --refresh-aspects
          else
            node scripts/fetch-data.mjs
          fi

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/collection.json data/aspect-cache.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: refresh GALC snapshot ($(date -u +%Y-%m-%d))"
          git push
